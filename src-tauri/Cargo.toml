[package]
name = "s3explorer"
version = "0.9.0"
description = "Fast cross-platform S3 explorer"
authors = ["s3explorer"]
edition = "2021"

[lib]
name = "s3explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: `Image::from_bytes` for the accent window icons (`set_window_icon`).
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# credentials-login: profiles signed in with `aws login` (login_session) are not in the default features.
aws-config = { version = "1", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
# Only to recognize a response checksum mismatch (already a dependency of aws-sdk-s3).
aws-smithy-checksums = "0.65"
thiserror = "2"
futures = "0.3"
# Only to throttle upload bodies (the Body trait the SDK's `SdkBody` takes; already in the tree).
http-body = "1"
bytes = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
# OS keychain for saved-connection secrets. Default feature `v1` picks the native store per
# platform: Windows Credential Manager, macOS Keychain, Linux Secret Service (pure-Rust zbus,
# no libdbus). There is no silent in-memory fallback: an unavailable store is an error.
keyring = "4.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Same reqwest/rustls (ring) stack the updater plugin already uses: no second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
# Tag character validation with the same Unicode classes as the UI (\p{L}, \p{N}). Already in the tree.
regex = "1"
unicode-normalization = "0.1"
# Recycle bin / trash for local panes (`trash_local`); never a permanent delete. Its `windows` 0.62
# dependency is already in the tree. Default features: COM apartment-threaded on Windows.
trash = "5"
# A second launch hands its command line to the running window (`launch:open`). No commands, so
# no capability.
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[dev-dependencies]
sha2 = "0.10"
# Mock runtime for the updater live check (examples/updater_check.rs). Dev-only: never in the app.
tauri = { version = "2", features = ["test"] }
base64 = "0.22"

# v0.9.1 network locations: resolve the saved Network Locations' shortcuts (IShellLinkW +
# IPersistFile). The same `windows` 0.62 the `trash` crate already brings in, more features.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
