<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Files moving between a computer and an S3 bucket in parallel parts">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 90) scale(620 420)">
      <stop offset="0" stop-color="#ffb81f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb81f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1420 360) scale(560 380)">
      <stop offset="0" stop-color="#ff6b57" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff6b57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb81f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb81f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFCB47"/>
      <stop offset="0.55" stop-color="#FFB81F"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF1D0"/>
      <stop offset="0.38" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE6B0"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F0E1F"/>
      <stop offset="1" stop-color="#1C1A33"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A75"/>
      <stop offset="1" stop-color="#F2553F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#7A4A00" flood-opacity="0.38"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="420" rx="24"/></clipPath>

    <!-- the five lanes between the computer and the bucket -->
    <path id="l1" d="M330 150 C 620 90, 1000 110, 1286 160"/>
    <path id="l2" d="M330 180 C 640 160, 980 200, 1286 190"/>
    <path id="l3" d="M330 210 C 620 230, 1000 190, 1286 220"/>
    <path id="l4" d="M330 240 C 640 220, 980 290, 1286 250"/>
    <path id="l5" d="M330 270 C 620 330, 1000 300, 1286 280"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="420" fill="#121214"/>
    <rect width="1600" height="420" fill="url(#grid)"/>
    <rect width="1600" height="420" fill="url(#glowA)"/>
    <rect width="1600" height="420" fill="url(#glowB)"/>

    <!-- faint tracks -->
    <g fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2" stroke-dasharray="3 9">
      <use href="#l1"/><use href="#l2"/><use href="#l3"/><use href="#l4"/><use href="#l5"/>
    </g>

    <!-- pulses: uploads run to the right, downloads to the left -->
    <g fill="none" stroke-width="3.5" stroke-linecap="round" filter="url(#soft)">
      <use href="#l1" pathLength="1000" stroke="#ffb81f" stroke-dasharray="120 880">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2.8s" repeatCount="indefinite"/>
      </use>
      <use href="#l2" pathLength="1000" stroke="#4fd6aa" stroke-dasharray="100 900">
        <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/>
      </use>
      <use href="#l3" pathLength="1000" stroke="#ffb81f" stroke-dasharray="140 860">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="2.2s" begin="-0.7s" repeatCount="indefinite"/>
      </use>
      <use href="#l4" pathLength="1000" stroke="#6cc4ff" stroke-dasharray="110 890">
        <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="3s" begin="-2.1s" repeatCount="indefinite"/>
      </use>
      <use href="#l5" pathLength="1000" stroke="#ffb81f" stroke-dasharray="130 870">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- parts travelling along the lanes -->
    <g font-family="ui-monospace, Consolas, monospace" font-size="12" text-anchor="middle">
      <g>
        <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1c1c1f" stroke="#ffb81f" stroke-opacity=".7"/>
        <text y="4" fill="#ffd27a">part 3/8</text>
        <animateMotion dur="2.8s" repeatCount="indefinite" begin="-0.9s"><mpath href="#l1"/></animateMotion>
      </g>
      <g>
        <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1c1c1f" stroke="#4fd6aa" stroke-opacity=".7"/>
        <text y="4" fill="#9fead0">16 MiB</text>
        <animateMotion dur="3.4s" repeatCount="indefinite" begin="-2.4s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion>
      </g>
      <g>
        <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1c1c1f" stroke="#ffb81f" stroke-opacity=".7"/>
        <text y="4" fill="#ffd27a">part 7/8</text>
        <animateMotion dur="3.2s" repeatCount="indefinite" begin="-0.4s"><mpath href="#l5"/></animateMotion>
      </g>
      <g>
        <rect x="-34" y="-11" width="68" height="22" rx="11" fill="#1c1c1f" stroke="#6cc4ff" stroke-opacity=".7"/>
        <text y="4" fill="#b9e2ff">8 MiB</text>
        <animateMotion dur="3s" repeatCount="indefinite" begin="-1.3s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion>
      </g>
    </g>

    <!-- the computer -->
    <g transform="translate(130 120)">
      <rect x="20" y="0" width="190" height="130" rx="12" fill="#1c1c1f" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
      <rect x="0" y="134" width="230" height="14" rx="7" fill="#26262a" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
      <!-- a file list on the screen -->
      <g fill="#fff">
        <rect x="40" y="22" width="14" height="16" rx="3" fill-opacity=".5"/><rect x="62" y="26" width="90" height="8" rx="4" fill-opacity=".35"/>
        <rect x="40" y="50" width="14" height="16" rx="3" fill-opacity=".5"/><rect x="62" y="54" width="70" height="8" rx="4" fill-opacity=".35"/>
        <rect x="40" y="78" width="14" height="16" rx="3" fill-opacity=".5"/><rect x="62" y="82" width="110" height="8" rx="4" fill-opacity=".35"/>
      </g>
      <!-- a progress bar -->
      <rect x="40" y="108" width="150" height="6" rx="3" fill="#fff" fill-opacity=".12"/>
      <rect x="40" y="108" width="150" height="6" rx="3" fill="#ffb81f">
        <animate attributeName="width" values="20;150;150;20" keyTimes="0;.7;.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- the bucket: the app icon -->
    <g transform="translate(1370 215)">
      <circle r="150" fill="url(#aura)">
        <animate attributeName="r" values="120;160;120" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <g transform="translate(-85 -85) scale(0.166)">
        <!-- tile -->
        <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
        <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#glow)"/>
        <rect x="67" y="67" width="890" height="890" rx="205" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
        
        <!-- bucket -->
        <g filter="url(#shadow)">
        <!-- body: tapered, with a rounded base -->
        <path d="M236 372 L306 742 C312 792 404 824 512 824 C620 824 712 792 718 742 L788 372 Z" fill="url(#body)"/>
        <!-- storage bands -->
        <path d="M262 508 C300 552 398 574 512 574 C626 574 724 552 762 508" fill="none" stroke="#FFB81F" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round"/>
        <path d="M286 636 C322 674 410 694 512 694 C614 694 702 674 738 636" fill="none" stroke="#FFB81F" stroke-opacity="0.40" stroke-width="20" stroke-linecap="round"/>
        <!-- rim and opening -->
        <ellipse cx="512" cy="372" rx="276" ry="92" fill="#FFFFFF"/>
        <ellipse cx="512" cy="372" rx="232" ry="66" fill="url(#inside)"/>
        </g>
        
        <!-- compass needle rising out of the bucket -->
        <g transform="rotate(38 512 372)">
        <path d="M512 118 L584 372 L512 372 Z" fill="url(#north)"/>
        <path d="M512 118 L440 372 L512 372 Z" fill="#FFA391"/>
        <path d="M512 626 L584 372 L512 372 Z" fill="#1C1A33"/>
        <path d="M512 626 L440 372 L512 372 Z" fill="#34305C"/>
        <circle cx="512" cy="372" r="34" fill="#FFFFFF"/>
        <circle cx="512" cy="372" r="16" fill="#1C1A33"/>
        </g>
      </g>
    </g>
  </g>
</svg>
